name: teste-prefeitura
# Teste manual, so leitura: descobre como a Imprensa Oficial de Itupeva lista as edicoes.
# Nao grava nada no repositorio e nao publica nada.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: investigar imprensa oficial
        run: |
          python3 - <<'PY'
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (radar Diario de Itupeva)"}
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)
              return r.read().decode("utf-8", "replace")
          base = "https://imprensaoficialmunicipal.com.br"
          h = get(base + "/itupeva")
          print("== scripts"); [print(s) for s in re.findall(r'<script[^>]+src="([^"]+)"', h)]
          print("== urls internas")
          for u in sorted(set(re.findall(r'["\'](/?[a-z0-9_\-/]+\.(?:php|json|pdf)[^"\']*)["\']', h, re.I)))[:40]: print(u)
          print("== trechos com ajax/fetch/edicao")
          for m in re.finditer(r'(ajax|fetch\(|\$\.get|\$\.post|edicao|edição|listar|getJSON)', h, re.I):
              print("...", re.sub(r"\s+", " ", h[max(0,m.start()-200):m.start()+300])); print()
          print("== formularios"); [print(f) for f in re.findall(r'<form[^>]*>', h)]
          print("== inputs"); [print(f) for f in re.findall(r'<input[^>]*>', h)][:20]
          PY

name: teste-prefeitura
# Teste manual, so leitura: lista as ultimas edicoes da Imprensa Oficial de Itupeva e tenta ler o texto da mais recente.
# Nao grava nada no repositorio e nao publica nada.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ler edicoes
        run: |
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          python3 - <<'PY'
          import base64, json, re, subprocess, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (radar Diario de Itupeva)"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60)
          raw = get("https://dosp.com.br/api/index.php/dioe.js/4924?callback=dioe").read().decode("utf-8", "replace")
          d = json.loads(raw[raw.index("(") + 1: raw.rindex(")")])
          eds = d.get("data", [])
          print(len(eds), "edicoes; campos:", list(eds[0].keys()) if eds else None)
          for e in eds[:8]:
              print({k: e.get(k) for k in ("data", "edicao_do", "pgtotal", "flag_extra", "iddo", "link", "cadernos_texto")})
          e = eds[0]
          link = e.get("link") or "https://dosp.com.br/exibe_do.php?i=" + base64.b64encode(str(e["iddo"]).encode()).decode()
          print("\nLINK:", link)
          r = get(link); conteudo = r.read()
          print("tipo:", r.headers.get("Content-Type"), "| bytes:", len(conteudo), "| inicio:", conteudo[:8])
          if conteudo[:4] != b"%PDF":
              h = conteudo.decode("utf-8", "replace")
              pdfs = re.findall(r'["\']([^"\']+\.pdf[^"\']*)["\']', h, re.I) + re.findall(r'(?:src|href|data)=["\']([^"\']+)["\']', h)[:15]
              print("links na pagina:", pdfs[:20])
          else:
              open("/tmp/ed.pdf", "wb").write(conteudo)
              t = subprocess.run(["pdftotext", "-layout", "-l", "3", "/tmp/ed.pdf", "-"], capture_output=True, text=True).stdout
              print("TEXTO (3 primeiras paginas), caracteres:", len(t))
              print(re.sub(r"[ \t]+", " ", t)[:2500])
          PY

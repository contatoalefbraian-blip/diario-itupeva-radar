name: teste-prefeitura
# Teste manual, so leitura: verifica se buscadores (Bing, Google Noticias) trazem as noticias novas
# do site da Prefeitura de Itupeva por feed RSS. Nao grava nada no repositorio e nao publica nada.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ler feeds de buscadores
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET
          UA = {"User-Agent": "Mozilla/5.0 (radar Diario de Itupeva)"}
          q = "site:itupeva.sp.gov.br"
          feeds = {
            "Bing busca (noticias)": "https://www.bing.com/search?format=rss&q=" + urllib.parse.quote(q + "/noticias"),
            "Bing busca (site todo)": "https://www.bing.com/search?format=rss&q=" + urllib.parse.quote(q),
            "Bing Noticias": "https://www.bing.com/news/search?format=rss&q=" + urllib.parse.quote(q),
            "Google Noticias": "https://news.google.com/rss/search?hl=pt-BR&gl=BR&ceid=BR:pt-419&q=" + urllib.parse.quote(q),
            "Bing Noticias 'Prefeitura de Itupeva'": "https://www.bing.com/news/search?format=rss&q=" + urllib.parse.quote('"Prefeitura de Itupeva"'),
          }
          for nome, url in feeds.items():
              print("\n=====", nome)
              try:
                  x = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30).read()
                  itens = ET.fromstring(x).findall(".//item")
              except Exception as e:
                  print("ERRO", e); continue
              print(len(itens), "itens")
              for it in itens[:12]:
                  print("-", it.findtext("pubDate"), "|", (it.findtext("title") or "")[:100], "|", (it.findtext("link") or "")[:120])
          PY

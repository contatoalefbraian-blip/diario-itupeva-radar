name: publicar
on:
  schedule:
    - cron: "*/10 10-23 * * *"   # a cada 10 min, das 7h as 20h50 (horario de Brasilia)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: preparar stories (versao 9:16 dos posts que vao sair agora)
        run: |
          pip install -q pillow
          python3 publicador/preparar_stories.py
          git config user.name "publicador"; git config user.email "publicador@users.noreply.github.com"
          git add fila && git commit -qm "stories" && { for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done; sleep 20; } || true
      - name: publicar posts aprovados que chegaram no horario
        id: pub
        continue-on-error: true
        run: python3 publicador/publicar.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_FB_TOKEN: ${{ secrets.META_FB_TOKEN }}
      - name: registrar
        run: |
          git config user.name "publicador"; git config user.email "publicador@users.noreply.github.com"
          git add -A fila publicados || true
          git commit -qm "publicador" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: avisar falha
        if: steps.pub.outcome == 'failure'
        run: exit 1

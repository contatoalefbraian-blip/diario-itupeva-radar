name: metricas
# Todo dia as 23h (Brasilia): fotografia das metricas para o relatorio da Karen.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 publicador/metricas.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_FB_TOKEN: ${{ secrets.META_FB_TOKEN }}
      - run: |
          git config user.name "metricas"; git config user.email "metricas@users.noreply.github.com"
          git add registro/metricas.jsonl && git commit -qm "metricas" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

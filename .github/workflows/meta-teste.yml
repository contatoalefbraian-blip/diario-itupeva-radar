name: meta-teste
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 publicador/meta_teste.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_FB_TOKEN: ${{ secrets.META_FB_TOKEN }}
